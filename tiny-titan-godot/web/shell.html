<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<!-- Tiny Titan's web page (the Web export's HTML shell, from Godot's own). Made for
		     a phone: full screen from the Home Screen, under the status bar, no zoom. -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Tiny Titan">
		<meta name="theme-color" content="#161222">
		<meta name="format-detection" content="telephone=no">
		<link rel="apple-touch-icon" href="icon-180.png">
		<link rel="icon" type="image/png" href="icon-192.png">
		<link rel="manifest" href="manifest.json">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	background-color: #161222;
	height: 100%;
}

body {
	color: #fff6ea;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	overscroll-behavior: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* A phone types through #tt-type (tt.js). The engine's own hidden typing box takes
   the page's focus ten times a second while a text box of the game is active, which
   pulls the keyboard away from the real field: it stays switched off (an element that
   is not displayed cannot take the focus). */
html.tt-touch .ime {
	display: none !important;
}

/* Loading: the hero, the name, a chunky bar. */
#status {
	position: absolute;
	inset: 0;
	background-color: #161222;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;
	visibility: hidden;
	font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
}

#status-splash {
	width: 128px;
	height: 128px;
	image-rendering: pixelated;
}

#status-title {
	font-weight: 800;
	font-size: 24px;
	letter-spacing: 2px;
	color: #ffc23d;
}

#status-progress {
	width: 220px;
	height: 14px;
	border: 2px solid #3a3160;
	background: #0d0a18;
	padding: 2px;
	box-sizing: content-box;
	display: none;
}

#status-fill {
	height: 100%;
	width: 0%;
	background: #ffc23d;
	transition: width 0.2s;
}

#status-note {
	font-size: 13px;
	color: #a99fc8;
}

#status-notice {
	display: none;
	background-color: #5b3943;
	border-radius: 8px;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	margin: 0 2rem;
	padding: 1rem;
	text-align: center;
}

/* Typing on a phone: a real text field the game hands its text box to (app/web_keys.gd). */
#tt-type {
	position: fixed;
	left: 0;
	right: 0;
	top: 0;
	padding: calc(env(safe-area-inset-top) + 8px) 10px 8px 10px;
	background: #241d3d;
	border-bottom: 2px solid #ffc23d;
	display: none;
	gap: 8px;
	align-items: center;
	z-index: 10;
	font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
}

#tt-type.on {
	display: flex;
}

#tt-type input {
	flex: 1;
	min-width: 0;
	font-size: 17px;
	padding: 9px 10px;
	border-radius: 6px;
	border: 2px solid #3a3160;
	background: #0d0a18;
	color: #fff6ea;
	-webkit-user-select: text;
	user-select: text;
}

#tt-type button {
	font-size: 16px;
	font-weight: 700;
	padding: 9px 14px;
	border-radius: 6px;
	border: none;
	background: #ffc23d;
	color: #161222;
}

/* A real button for what a phone only allows inside a tap (share a picture, pick a file). */
#tt-act {
	position: fixed;
	left: 12px;
	right: 12px;
	bottom: calc(env(safe-area-inset-bottom) + 76px);
	display: none;
	gap: 8px;
	z-index: 11;
	font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
}

#tt-act.on {
	display: flex;
}

#tt-act button {
	font-size: 17px;
	font-weight: 800;
	padding: 14px;
	border-radius: 8px;
	border: 2px solid #161222;
}

#tt-act-go {
	flex: 1;
	background: #ffc23d;
	color: #161222;
}

#tt-act-no {
	background: #3a3160;
	color: #fff6ea;
}

#tt-safe {
	position: fixed;
	left: 0;
	top: 0;
	width: 0;
	height: 0;
	visibility: hidden;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Tiny Titan needs JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="icon-192.png" alt="">
			<div id="status-title">TINY TITAN</div>
			<div id="status-progress"><div id="status-fill"></div></div>
			<div id="status-note">Loading your hero...</div>
			<div id="status-notice"></div>
		</div>

		<div id="tt-type"><input id="tt-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done"><button id="tt-done" type="button">Done</button></div>
		<div id="tt-act"><button id="tt-act-go" type="button">Save it</button><button id="tt-act-no" type="button">Not now</button></div>
		<div id="tt-safe"></div>

		<script>window.ttBuild = '%TT_BUILD%';</script>
		<script src="tt.js"></script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusFill = document.getElementById('status-fill');
	const statusNote = document.getElementById('status-note');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		statusNote.textContent = '';
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Something went wrong while loading.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('This browser is missing something Tiny Titan needs:\n' + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusFill.style.width = Math.round(100 * current / total) + '%';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
